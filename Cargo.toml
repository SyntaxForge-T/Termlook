[package]
name = "termlook"
version = "0.4.2"
edition = "2021"
rust-version = "1.85"
description = "A native terminal with workspaces, split panes and live customization"
license = "MIT"
repository = "https://github.com/SyntaxForge-T/Termlook"

[dependencies]
gtk = "0.18"
glib = "0.18"
gio = "0.18"
gdk = "0.18"
pango = "0.18"
libc = "0.2"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

