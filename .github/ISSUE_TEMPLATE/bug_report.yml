name: Bug report
description: Report a reproducible problem with TermLook.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open TermLook
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: TermLook version, Linux distribution, desktop, X11 or Wayland, and shell.
      placeholder: TermLook 0.2.0, Ubuntu 24.04, GNOME, Wayland, zsh
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Source checkout
        - Debian package (.deb)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots
      description: Include relevant details. Remove tokens and private terminal output before sharing.
