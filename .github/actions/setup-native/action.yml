name: Set up native build environment
description: Install the GTK and VTE development libraries, a Rust toolchain and the cargo cache.

inputs:
  toolchain:
    description: Rust toolchain to install, such as stable or 1.88.
    default: stable
  components:
    description: Comma-separated rustup components, such as rustfmt,clippy.
    default: ''
  extra-packages:
    description: Additional space-separated apt packages for this job.
    default: ''

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086 # EXTRA_PACKAGES is a deliberate word list.
        sudo apt-get install -y build-essential pkg-config libgtk-3-dev libvte-2.91-dev \
          libayatana-appindicator3-1 librsvg2-common $EXTRA_PACKAGES
    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        if [ -n "$COMPONENTS" ]; then
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component "$COMPONENTS"
        else
          rustup toolchain install "$TOOLCHAIN" --profile minimal
        fi
        rustup default "$TOOLCHAIN"
        rustc --version --verbose
    - name: Restore cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Only main writes the cache, so pull requests cannot evict it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
