name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/io.termlook.TermLook.svg
      - VERSION
      - scripts/build_site.sh
      - scripts/check_site.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/images/**
      - assets/io.termlook.TermLook.svg
      - VERSION
      - scripts/build_site.sh
      - scripts/check_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Pull requests only build and check the site. Deployments never overlap and
# are never cancelled half way through.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        run: ./scripts/build_site.sh _site
      - name: Check links and metadata
        run: python3 -I scripts/check_site.py _site
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
